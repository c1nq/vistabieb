<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Vista Leest</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/leden">Leden</a>
        <a href="/boeken">Boeken</a>
        <a href="/leningen">Leningen</a>
        <a href="/logout">Logout</a>
    </div>
    
    <h1>Dashboard</h1>
    <div class="card"><strong>Leden:</strong> {{ leden }}</div>
    <div class="card"><strong>Boeken:</strong> {{ boeken }}</div>
    <div class="card"><strong>Actieve leningen:</strong> {{ leningen }}</div>
</body>
</html>
