{% extends "base.html" %}

{% block title %}Dashboard - Vista Leest{% endblock %}

{% block content %}
<h1 class="mb-4">Dashboard</h1>

<div class="row">
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Totaal Leden</h5>
                <p class="card-text display-4">{{ leden }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Totaal Boeken</h5>
                <p class="card-text display-4">{{ boeken }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Actieve Leningen</h5>
                <p class="card-text display-4">{{ leningen }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
