{% extends "base.html" %}

{% block title %}Nieuwe lening - Vista Leest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Nieuwe lening</h1>

        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="lid_id" class="form-label">Lid</label>
                        <select class="form-select" id="lid_id" name="lid_id" required>
                            <option value="">-- Selecteer lid --</option>
                            {% for lid in leden %}
                            <option value="{{ lid.id }}">{{ lid.voornaam }} {{ lid.achternaam }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="boek_id" class="form-label">Boek</label>
                        <select class="form-select" id="boek_id" name="boek_id" required>
                            <option value="">-- Selecteer boek --</option>
                            {% for boek in boeken %}
                            <option value="{{ boek.id }}">{{ boek.titel }} ({{ boek.auteur }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="levering_optie" name="levering_optie">
                        <label class="form-check-label" for="levering_optie">
                            Levering aanvragen (boek wordt bezorgd)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Lening aanmaken</button>
                    <a href="/leningen" class="btn btn-secondary w-100 mt-2">Annuleren</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
