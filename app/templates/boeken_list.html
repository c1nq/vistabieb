<!DOCTYPE html>
<html>
<head>
    <title>Boeken - Vista Leest</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #007bff; }
        .btn { padding: 8px 15px; background: #007bff; color: white; text-decoration: none; border: none; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/leden">Leden</a>
        <a href="/boeken">Boeken</a>
        <a href="/leningen">Leningen</a>
        <a href="/logout">Logout</a>
    </div>
    
    <h1>Boeken</h1>
    <a href="/boeken/add" class="btn">+ Nieuw boek</a>
    
    <table>
        <tr>
            <th>Titel</th>
            <th>Auteur</th>
            <th>ISBN</th>
            <th>Categorie</th>
        </tr>
        {% for boek in boeken %}
        <tr>
            <td>{{ boek.titel }}</td>
            <td>{{ boek.auteur }}</td>
            <td>{{ boek.isbn }}</td>
            <td>{{ boek.categorie }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
