{% extends "base.html" %}

{% block title %}Boeken - Vista Leest{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Boeken</h1>
    <a href="/boeken/add" class="btn btn-success">+ Nieuw boek</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Titel</th>
                <th>Auteur</th>
                <th>ISBN</th>
                <th>Categorie</th>
                <th>Acties</th>
            </tr>
        </thead>
        <tbody>
            {% for boek in boeken %}
            <tr>
                <td>{{ boek.titel }}</td>
                <td>{{ boek.auteur }}</td>
                <td>{{ boek.isbn }}</td>
                <td><span class="badge bg-info">{{ boek.categorie }}</span></td>
                <td>
                    <a href="/boeken/{{ boek.id }}/edit" class="btn btn-sm btn-primary">Bewerk</a>
                    <a href="/reserveringen/new/{{ boek.id }}" class="btn btn-sm btn-info">Reserveer</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
