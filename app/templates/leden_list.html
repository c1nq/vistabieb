{% extends "base.html" %}

{% block title %}Leden - Vista Leest{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Leden</h1>
    <a href="/leden/add" class="btn btn-success">+ Nieuw lid</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Voornaam</th>
                <th>Achternaam</th>
                <th>Email</th>
                <th>Telefoon</th>
                <th>Acties</th>
            </tr>
        </thead>
        <tbody>
            {% for lid in leden %}
            <tr>
                <td>{{ lid.voornaam }}</td>
                <td>{{ lid.achternaam }}</td>
                <td>{{ lid.email }}</td>
                <td>{{ lid.telefoon }}</td>
                <td>
                    <a href="/leden/{{ lid.id }}/edit" class="btn btn-sm btn-primary">Bewerk</a>
                    <form method="post" action="/leden/{{ lid.id }}/delete" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Zeker weten?')">Verwijder</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
