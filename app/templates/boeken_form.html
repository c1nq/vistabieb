{% extends "base.html" %}

{% block title %}Nieuw boek - Vista Leest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">{% if boek %}Bewerk boek{% else %}Nieuw boek{% endif %}</h1>
        
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="titel" class="form-label">Titel</label>
                        <input type="text" class="form-control" id="titel" name="titel" value="{{ boek.titel if boek else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="auteur" class="form-label">Auteur</label>
                        <input type="text" class="form-control" id="auteur" name="auteur" value="{{ boek.auteur if boek else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="isbn" class="form-label">ISBN</label>
                        <input type="text" class="form-control" id="isbn" name="isbn" value="{{ boek.isbn if boek else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="uitgever" class="form-label">Uitgever</label>
                        <input type="text" class="form-control" id="uitgever" name="uitgever" value="{{ boek.uitgever if boek else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="jaar_uitgave" class="form-label">Jaar uitgave</label>
                        <input type="number" class="form-control" id="jaar_uitgave" name="jaar_uitgave" value="{{ boek.jaar_uitgave if boek else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="categorie" class="form-label">Categorie</label>
                        <input type="text" class="form-control" id="categorie" name="categorie" value="{{ boek.categorie if boek else '' }}">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Opslaan</button>
                    <a href="/boeken" class="btn btn-secondary w-100 mt-2">Annuleren</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
