{% extends "base.html" %}

{% block title %}Reserveer - Vista Leest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Reserveer boek</h1>

        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label"><strong>Boek:</strong></label>
                    <p>{{ boek.titel }}</p>
                </div>

                <form method="post">
                    <div class="mb-3">
                        <label for="lid_id" class="form-label">Lid</label>
                        <select class="form-select" id="lid_id" name="lid_id" required>
                            <option value="">-- Selecteer lid --</option>
                            {% for lid in leden %}
                            <option value="{{ lid.id }}">{{ lid.voornaam }} {{ lid.achternaam }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Reserveer</button>
                    <a href="/reserveringen" class="btn btn-secondary w-100 mt-2">Annuleren</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
