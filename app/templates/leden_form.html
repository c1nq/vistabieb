{% extends "base.html" %}

{% block title %}{% if lid %}Bewerk{% else %}Nieuw{% endif %} lid - Vista Leest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">{% if lid %}Bewerk lid{% else %}Nieuw lid{% endif %}</h1>
        
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="voornaam" class="form-label">Voornaam</label>
                        <input type="text" class="form-control" id="voornaam" name="voornaam" value="{{ lid.voornaam if lid else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="achternaam" class="form-label">Achternaam</label>
                        <input type="text" class="form-control" id="achternaam" name="achternaam" value="{{ lid.achternaam if lid else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ lid.email if lid else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefoon" class="form-label">Telefoon</label>
                        <input type="tel" class="form-control" id="telefoon" name="telefoon" value="{{ lid.telefoon if lid else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="adres" class="form-label">Adres</label>
                        <input type="text" class="form-control" id="adres" name="adres" value="{{ lid.adres if lid else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="postcode" class="form-label">Postcode</label>
                        <input type="text" class="form-control" id="postcode" name="postcode" value="{{ lid.postcode if lid else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="plaats" class="form-label">Plaats</label>
                        <input type="text" class="form-control" id="plaats" name="plaats" value="{{ lid.plaats if lid else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="lidnummer" class="form-label">Lidnummer</label>
                        <input type="text" class="form-control" id="lidnummer" name="lidnummer" value="{{ lid.lidnummer if lid else '' }}">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Opslaan</button>
                    <a href="/leden" class="btn btn-secondary w-100 mt-2">Annuleren</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
