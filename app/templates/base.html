<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vista Leest Bibliotheek{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vistabieb.css') }}">
    <style>
        body { padding-top: 60px; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">📚 Vista Leest</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leden">Leden</a></li>
                    <li class="nav-item"><a class="nav-link" href="/boeken">Boeken</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leningen">Leningen</a></li>
                    <li class="nav-item"><a class="nav-link" href="/barcode-scanner">Scanner</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reserveringen">Reserveringen</a></li>
                    <li class="nav-item"><a class="nav-link" href="/herinneringen">Herinneringen</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Uitloggen</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
